{% extends 'store/base.html' %}
{% block content %}
<div class="detail">
  <img src="{{ product.image_url }}" alt="{{ product.name }}">
  <div>
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <h2>₹{{ product.price }}</h2>
    <a href="{% url 'add_to_cart' product.id %}" class="btn">Add to Cart</a>
    <a href="{% url 'home' %}">← Back to products</a>
  </div>
</div>
{% endblock %}

{% extends 'store/base.html' %}
{% block content %}
<h1>Checkout</h1>
<ul>
  {% for item in items %}
  <li>{{ item.product.name }} × {{ item.quantity }} = ₹{{ item.subtotal }}</li>
  {% endfor %}
</ul>
<h3>Total: ₹{{ total }}</h3>

<form method="post" id="checkout-form">             <!-- method="post" → sends data to our checkout view -->
  {% csrf_token %}
  <label>Delivery Address:</label><br>
  <textarea name="address" id="address" rows="4" cols="40"></textarea><br>
  <!-- name="address" must match request.POST['address'] in views.py -->
  <button type="submit" class="btn">Place Order</button>
</form>
{% endblock %}

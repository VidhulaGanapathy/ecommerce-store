{% load static %}                                   
<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
  <link rel="stylesheet" href="{% static 'store/style.css' %}">   <!-- connect CSS -->
</head>
<body>
  <nav>                                             <!-- navigation bar shown on every page -->
    <a href="{% url 'home' %}">🛍️ My Shop</a>
    <a href="{% url 'cart' %}">Cart</a>
    {% if user.is_authenticated %}                  <!-- 'user' is available automatically in every template -->
      <a href="{% url 'my_orders' %}">My Orders</a>
      <form method="post" action="{% url 'logout' %}" class="inline">   <!-- logout must be a POST form -->
        {% csrf_token %}
        <button type="submit">Logout ({{ user.username }})</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>

  <div class="container">
    {% block content %}{% endblock %}               <!-- each page's own content goes here -->
  </div>

  <script src="{% static 'store/script.js' %}"></script>   <!-- connect JavaScript -->
</body>
</html>

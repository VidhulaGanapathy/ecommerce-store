{% extends 'store/base.html' %}
{% block content %}
<div class="auth-box">
  <h2>Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-full">Sign Up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
